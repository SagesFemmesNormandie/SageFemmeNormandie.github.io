<!DOCTYPE html>
<html lang="fr-FR">
<head>
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <title>Recherche d’une Sage femme</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style type="text/css">
    {% capture include_to_scssify %}
      {% include base.scss %}
    {% endcapture %}
    {{ include_to_scssify | scssify }}

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    .container {
      width: 100%;
      height: 100%;
    }
    #map-canvas {
      width: 100%;
      height: 100%;
      min-height: 600px;
    }
    .side-bar {
      display: block;
      padding: 0 0.5rem 0.5rem;
    }
    .side-bar p {
      display: none;
    }
    #side-bar-content {
      display: none;
      overflow-y: scroll;
      padding: 1rem 0 2rem;
      height: 70%;
    }
    @media screen and (min-width: 640px) {
      .container {
        display: flex;
      }
      #map-canvas {
        width: 75%;
      }
      .side-bar {
        order: 2;
        padding: 0 0.5rem;
        width: 25%;
        height: 100%;
      }
      .side-bar p {
        display: block;
      }
      #side-bar-content {
        display: block;
      }
    }
    .side-bar .side-bar_element {
      padding: 0.2rem;
      font-family: Helvetica, Arial;
      border-bottom: 1px solid #ccc;
    }
    .side-bar a {
      font-size: 1.1rem;
      text-decoration: none;
      color: #333;
    }
  </style>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
</head>

<body>
  <div class="container">
    <div class="side-bar">
      <h1>Liste des Sage-femmes</h1>
      <p><em>Cliquez sur le nom d‘une Sage-femme pour afficher ses coordonnées</em></p>
      <div id="side-bar-content"></div>
    </div>
    <div id="map-canvas"></div>
  </div>

  <script type="text/javascript">
    var side_bar_html = "";
    var gmarkers = [];
    var map = null;
    var markerCluster = null;

    function escapeForJs(str) {
      if (!str) return "";
      return String(str).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, ' ').replace(/\r/g, ' ');
    }

    function initialize() {
      map = L.map('map-canvas', {preferCanvas: true}).setView([49.443231, 1.099971], 9);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      markerCluster = L.markerClusterGroup({
        chunkedLoading: true,
        showCoverageOnHover: false,
        maxClusterRadius: 50
      });
      map.addLayer(markerCluster);

      {%- assign membersdata = site.data.members | sort: 'nom' -%}
      {% for row in membersdata %}{% for coordinates in site.data[row.nom_entier].first %}
      {% if forloop.first %}
      (function(){
        var lat = {{ site.data[row.nom_entier].location.latitude }};
        var lng = {{ site.data[row.nom_entier].location.longitude }};
        var title = "{{ row.prenom }} {{ row.nom }}";

        var popupHtml = "{% assign places = site.data.members | sort: 'adresse' %}{% for place in places %}{% if place.adresse-geo == row.adresse-geo %}<a href='/{{ place.nom_entier }}/'><strong>{{ place.prenom }} {{ place.nom }}</strong></a><br>{{ place.adresse | escape | strip_newlines }}<br><strong>{{ row.ville }}</strong><br>{{ place.telephone-mobile }}{% if place.telephone-fixe %}{% if place.telephone-mobile %} - {% endif %}{{ place.telephone-fixe }}{% endif %}{% if place.email %}<br>{{ place.email }}{% endif %}{% if place.site-web %}<br>{{ place.site-web }}{% endif %}<br>{% endif %}{% endfor %}";

        // ensure quotes/newlines won't break JS by escaping on the fly
        popupHtml = popupHtml.replace(/"/g, '\\"').replace(/(\r\n|\n|\r)/gm, ' ');

        var marker = L.marker([lat, lng], {title: title});
        marker.bindPopup(popupHtml, {maxWidth: 300});

        gmarkers.push(marker);
        markerCluster.addLayer(marker);

        var index = gmarkers.length - 1;
        side_bar_html += '<div class="side-bar_element"><a href="javascript:myclick(' + index + ')">' + title + '</a></div>';
        document.getElementById("side-bar-content").innerHTML = side_bar_html;
      })();
      {% endif %}{% endfor %}{% endfor %}

      if (gmarkers.length > 0) {
        var group = new L.featureGroup(gmarkers);
        map.fitBounds(group.getBounds().pad(0.1));
      }
    }

    function myclick(i) {
      if (!gmarkers[i]) return;
      var marker = gmarkers[i];
      marker.openPopup();
      var latlng = marker.getLatLng();
      var targetZoom = Math.max(map.getZoom(), 12);
      map.setView(latlng, targetZoom, {animate: true});
    }

    document.addEventListener("DOMContentLoaded", initialize);
  </script>
</body>
</html>
